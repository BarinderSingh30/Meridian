services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: meridian
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        DATABASE_URL: postgresql://meridian:meridian@db:5432/meridian
        DIRECT_URL: postgresql://meridian:meridian@db:5432/meridian
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://meridian:meridian@db:5432/meridian
      DIRECT_URL: postgresql://meridian:meridian@db:5432/meridian
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
